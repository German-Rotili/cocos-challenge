services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while database.sql loads, Postgres only listens on its socket, so this waits for the seed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cocos -d cocos_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos_test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos -d cocos_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  